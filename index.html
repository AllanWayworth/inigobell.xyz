<!DOCTYPE html>
<html>
<head>
    <title>Inigo Bell</title>

    <style>
        body {
            font-family: Georgia, serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            background: white;
            color: black;
        }

        h1 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 60px;
        }

        h2 {
            font-weight: normal;
            margin-top: 60px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .cover {
            width: 180px;
            height: 280px;
            border: 1px solid black;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 15px;

            text-decoration: none;
            color: black;
        }

        .cover:hover {
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<h1>INIGO BELL</h1>

<h2>BOOKS</h2>

<div class="grid">
    <a class="cover" href="#">BOOK TITLE</a>
    <a class="cover" href="#">BOOK TITLE</a>
    <a class="cover" href="#">BOOK TITLE</a>
    <a class="cover" href="#">BOOK TITLE</a>
</div>

<h2>PLAYS</h2>

<div class="grid">
    <a class="cover" href="#">PLAY TITLE</a>
    <a class="cover" href="#">PLAY TITLE</a>
    <a class="cover" href="#">PLAY TITLE</a>
</div>

</body>
</html>
